server:
  port: 8080

spring:
  application:
    name: cricket-scores
  datasource:
    url: jdbc:h2:mem:cricketdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

cricket:
  simulation:
    tick-ms: 3500
    innings-break-ticks: 3

logging:
  level:
    com.cricket.scores: INFO
